                [loginView, quizView, resultView, teacherView].forEach(view => view.classList.add("hidden"));
                document.getElementById(viewId).classList.remove("hidden");

                // Cập nhật trạng thái active của Tab
                if (viewId === 'teacher-view') {
                    teacherTab.classList.add("border-blue-500", "text-blue-600");
                    teacherTab.classList.remove("border-transparent", "hover:text-gray-600");
                    studentTab.classList.add("border-transparent", "hover:text-gray-600");
                    studentTab.classList.remove("border-blue-500", "text-blue-600");
                } else {
                    studentTab.classList.add("border-blue-500", "text-blue-600");
                    studentTab.classList.remove("border-transparent", "hover:text-gray-600");
                    teacherTab.classList.add("border-transparent", "hover:text-gray-600");
                    teacherTab.classList.remove("border-blue-500", "text-blue-600");
                }
            };

            // Tạo giao diện câu hỏi
            const renderQuestions = () => {
                questionsContainer.innerHTML = ""; // Xóa câu hỏi cũ
                questions.forEach((q, index) => {
                    // Tạo HTML cho các lựa chọn
                    const optionsHTML = Object.entries(q.options).map(([key, value]) => `
                        <label for="${q.id}-${key}" class="flex items-start p-3 -mt-px border border-gray-200 rounded-b-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" id="${q.id}-${key}" name="${q.id}" value="${key}" class="w-4 h-4 mt-1 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 focus:ring-2" required>
                            <span class="ml-3 text-sm font-medium text-gray-900">${key}. ${value}</span>
                        </label>
                    `).join("");

                    // Tạo HTML cho câu hỏi
                    const questionHTML = `
                        <div class="mb-8 bg-white shadow-md rounded-lg overflow-hidden">
                            <!-- Tiêu đề câu hỏi -->
                            <div class="p-4 bg-gray-50 border-b border-gray-200">
                                <p class="font-semibold text-gray-800">Câu ${index + 1}:</p>
                            </div>
                            <!-- Nội dung câu hỏi -->
                            <div class="p-4 text-gray-700 leading-relaxed whitespace-pre-line">
                                ${q.text}
                            </div>
                            <!-- Các lựa chọn -->
                            <div class="px-4 pb-4">
                                <div class="border border-gray-200 rounded-lg">
                                    ${optionsHTML}
                                </div>
                            </div>
                        </div>
                    `;
                    questionsContainer.innerHTML += questionHTML;
                });
            };

            // Xử lý sự kiện bắt đầu làm bài
            startQuizBtn.onclick = () => {
                currentStudentName = studentNameInput.value.trim();
                if (currentStudentName === "") {
                    displayMessage("Vui lòng nhập tên của bạn.", true);
                    return;
                }
                studentNameDisplay.textContent = `Chúc may mắn, ${currentStudentName}!`;
                renderQuestions(); // Tạo câu hỏi
                showView("quiz-view");
            };

            // Xử lý sự kiện nộp bài
            quizForm.onsubmit = async (e) => {
                e.preventDefault();
                displayMessage("Đang nộp bài, vui lòng chờ...");

                const formData = new FormData(quizForm);
                let score = 0;
                let userAnswers = {};

                for (const q of questions) {
                    const answer = formData.get(q.id);
                    userAnswers[q.id] = answer;
                    if (answer === correctAnswers[q.id]) {
                        score++;
                    }
                }

                const resultData = {
                    studentName: currentStudentName,
                    score: score,
                    total: questions.length,
                    submittedAt: new Date().toISOString(), // Lưu dạng ISO string
                    userId: userId // Lưu userId để tham khảo (nếu cần)
                };

                // Lưu kết quả vào Firestore
                try {
                    if (!db) throw new Error("Kết nối cơ sở dữ liệu chưa sẵn sàng.");
                    
                    const docRef = await addDoc(collection(db, RESULTS_COLLECTION_PATH), resultData);
                    console.log("Đã lưu kết quả với ID: ", docRef.id);
                    
                    // Hiển thị kết quả
                    scoreDisplay.textContent = `Bạn đã trả lời đúng ${score} / ${questions.length} câu.`;
                    showView("result-view");
                    messageModal.classList.add("hidden"); // Ẩn thông báo "Đang nộp bài"

                } catch (error) {
                    console.error("Lỗi khi lưu điểm:", error);
                    displayMessage(`Không thể lưu điểm của bạn. Lỗi: ${error.message}`, true);
                }
            };

            // Xử lý sự kiện làm lại bài
            retakeQuizBtn.onclick = () => {
                studentNameInput.value = ""; // Xóa tên
                quizForm.reset(); // Reset form
                showView("login-view");
            };

            // Xử lý sự kiện xem bảng điểm (Giáo viên)
            teacherTab.onclick = () => {
                showView("teacher-view");
                
                // Hủy đăng ký listener cũ (nếu có) để tránh rò rỉ bộ nhớ
                if (unsubscribeFromResults) {
                    unsubscribeFromResults();
                }

                // Nếu chưa kết nối DB thì không làm gì cả
                if (!db) {
                    resultsTbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Chưa kết nối đến cơ sở dữ liệu.</td></tr>';
                    return;
                }

                // Tạo query (sắp xếp theo thời gian mới nhất)
                // LƯU Ý: Firestore có thể yêu cầu tạo chỉ mục (index) cho việc sắp xếp này.
                // Nếu thấy lỗi trên console, hãy theo link lỗi để tạo chỉ mục.
                // Tạm thời, chúng ta sẽ tải và sắp xếp phía client để tránh lỗi index.
                const q = query(collection(db, RESULTS_COLLECTION_PATH));
                
                resultsTbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">Đang tải điểm...</td></tr>';

                // Lắng nghe thay đổi thời gian thực
                unsubscribeFromResults = onSnapshot(q, (snapshot) => {
                    if (snapshot.empty) {
                        resultsTbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">Chưa có học sinh nào nộp bài.</td></tr>';
                        return;
                    }

                    // Sắp xếp dữ liệu phía client theo thời gian nộp
                    const results = snapshot.docs.map(doc => doc.data());
                    results.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                    resultsTbody.innerHTML = ""; // Xóa bảng
                    results.forEach(data => {
                        const submittedDate = new Date(data.submittedAt);
                        const formattedDate = `${submittedDate.toLocaleDateString('vi-VN')} ${submittedDate.toLocaleTimeString('vi-VN')}`;
                        
                        const row = `
                            <tr class="bg-white border-b hover:bg-gray-50">
                                <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
                                    ${data.studentName}
                                </td>
                                <td class="px-6 py-4 text-gray-700">
                                    ${data.score} / ${data.total}
                                </td>
                                <td class="px-6 py-4 text-gray-700">
                                    ${formattedDate}
                                </td>
                            </tr>
                        `;
                        resultsTbody.innerHTML += row;
                    });
                }, (error) => {
                    console.error("Lỗi khi tải bảng điểm:", error);
                    resultsTbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Lỗi tải bảng điểm: ${error.message}</td></tr>`;
                });
            };

            // Xử lý sự kiện quay lại tab học sinh
            studentTab.onclick = () => {
                // Hủy đăng ký listener của giáo viên
                if (unsubscribeFromResults) {
                    unsubscribeFromResults();
                    unsubscribeFromResults = null;
                }
                
                // Quay lại màn hình đăng nhập
                quizForm.reset();
                showView("login-view");
            };

        });
    </script>
    <style>
        /* Sử dụng font Inter */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6; /* Màu nền nhẹ nhàng */
        }
        /* Cải thiện hiển thị pre-tag (cho câu 11) */
        pre {
            font-family: 'Courier New', Courier, monospace;
        }
        /* Cải thiện radio button */
        input[type="radio"]:checked + span {
            color: #2563eb; /* text-blue-600 */
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Container chính -->
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Tiêu đề ứng dụng -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-700">Bài Test SAT</h1>
            <p class="text-lg text-gray-600">Reading & Writing (Module 2)</p>
        </header>

        <!-- Thanh Tabs điều hướng -->
        <div class="mb-6 border-b border-gray-200">
            <ul class="flex flex-wrap -mb-px text-sm font-medium text-center text-gray-500">
                <li class="mr-2">
                    <button id="student-tab" class="inline-block p-4 border-b-2 rounded-t-lg border-blue-500 text-blue-600" type="button">
                        Làm Bài (Học sinh)
                    </button>
                </li>
                <li>
                    <button id="teacher-tab" class="inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" type="button">
                        Xem Điểm (Giáo viên)
                    </button>
                </li>
            </ul>
        </div>

        <!-- Vùng nội dung chính -->
        <main id="content-area">

            <!-- Màn hình 1: Đăng nhập (Học sinh) -->
            <div id="login-view" class="bg-white p-8 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold text-center mb-6">Chào mừng!</h2>
                <div class="max-w-sm mx-auto">
                    <label for="student-name" class="block mb-2 text-sm font-medium text-gray-900">Vui lòng nhập tên của bạn:</label>
                    <input type_ "text" id="student-name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Ví dụ: Nguyễn Văn A" required>
                    <button id="start-quiz-btn" class="mt-6 w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors duration-200">
                        Bắt đầu làm bài
                    </button>
                </div>
            </div>

            <!-- Màn hình 2: Làm bài (Học sinh) -->
            <div id="quiz-view" class="hidden">
                <h2 id="student-name-display" class="text-xl font-semibold mb-6 text-gray-700"></h2>
                <form id="quiz-form">
                    <div id="questions-container">
                        <!-- Câu hỏi sẽ được chèn vào đây bằng JS -->
                    </div>
                    <button type="submit" class="w-full mt-6 text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors duration-200">
                        NỘP BÀI VÀ XEM KẾT QUẢ
                    </button>
                </form>
            </div>

            <!-- Màn hình 3: Kết quả (Học sinh) -->
            <div id="result-view" class="hidden bg-white p-8 rounded-lg shadow-lg text-center">
                <h2 class="text-2xl font-semibold mb-4 text-blue-700">Hoàn thành!</h2>
                <p id="score-display" class="text-3xl font-bold text-gray-800 mb-6"></p>
                <p class="text-gray-600 mb-6">Kết quả của bạn đã được lưu lại.</p>
                <button id="retake-quiz-btn" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors duration-200">
                    Làm lại bài khác
                </button>
            </div>

            <!-- Màn hình 4: Bảng điểm (Giáo viên) -->
            <div id="teacher-view" class="hidden">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800">Bảng điểm của Lớp</h2>
                <div class="relative overflow-x-auto shadow-md rounded-lg">
                    <table id="results-table" class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                            <tr>
                                <th scope="col" class="px-6 py-3">
                                    Tên Học sinh
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    Điểm số
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    Thời gian nộp
                                </th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody">
                            <!-- Kết quả sẽ được chèn vào đây bằng JS -->
                            <tr>
                                <td colspan="3" class="px-6 py-4 text-center">Chưa có dữ liệu.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal Thông báo (Loading/Error) -->
    <div id="message-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full text-center">
            <p id="message-text" class="text-lg font-medium text-gray-800"></p>
            <button id="close-message-btn" class="mt-4 text-sm text-blue-600 hover:text-blue-800">Đóng</button>
        </div>
    </div>

</body>
</html>
